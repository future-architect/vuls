name: Check vuls-data-update enums

# Deliberately NOT triggered by pull_request: this checks a repository-wide
# condition (is the pinned vuls-data-update behind nightly?), not anything a
# PR author controls — running it per PR would fail unrelated work (incl.
# dependabot) whenever upstream drifts, and would permanently block hotfix
# PRs on maintenance lines whose pins are legitimately old. The daily cron is
# the drift alarm; use workflow_dispatch to check on demand (e.g. while
# preparing a bump PR).
on:
  workflow_dispatch:
  schedule:
    - cron: '37 21 * * *'

permissions: {}

jobs:
  enum-diff:
    name: Enum list diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.diff.outputs.drift }}
      diff: ${{ steps.diff.outputs.diff }}
      nightly: ${{ steps.diff.outputs.nightly }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job executes code fetched from the upstream branch (go run);
          # do not leave the repo-scoped token readable in git config.
          persist-credentials: false
      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The extracted-data schema's enum vocabularies are lenient at
      # unmarshal: data carrying values this build does not know is read
      # losslessly but skipped (with a warning on the scan result) at
      # detection. This job fails when the vuls-data-update pinned in go.mod
      # knows fewer enum values than the nightly branch — i.e. when a
      # dependency bump is due before data produced with the new values
      # reaches detection. The known sets are append-only, so a plain diff
      # suffices. The moving branch is resolved to a commit once per run, so
      # execution, the log, and the filed issue all refer to the same
      # revision.
      - name: Diff known enum sets against vuls-data-update nightly
        id: diff
        shell: bash
        env:
          GOEXPERIMENT: jsonv2
        run: |
          nightly=$(git ls-remote https://github.com/MaineK00n/vuls-data-update.git refs/heads/nightly | cut -f1)
          echo "comparing against vuls-data-update nightly @ $nightly"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          # Run the printers before diffing so a fetch/build failure fails
          # the step here, without ever setting drift: only a genuine list
          # difference (diff exit 1) files the issue, not an execution error
          # (go run failure, or diff exit 2).
          pinned=$(go run github.com/MaineK00n/vuls-data-update/tools/print-enums)
          tip=$(go run "github.com/MaineK00n/vuls-data-update/tools/print-enums@$nightly")
          set +e
          d=$(diff <(printf '%s\n' "$pinned") <(printf '%s\n' "$tip"))
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'diff<<GH_OUTPUT_EOF'
            printf '%s\n' "$d"
            echo 'GH_OUTPUT_EOF'
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$d"
          exit $rc

  # Issue writing runs in a separate job so that the token holding
  # issues: write never coexists with executing code fetched from the
  # upstream branch — the diff job above runs `go run` on it with
  # contents: read only. Drift is a state, not an event: it persists until a
  # bump PR merges, so the alarm is one open issue (deduplicated by label)
  # rather than a notification that depends on someone's settings. Assignees
  # are the vuls2-integration maintainers.
  file-issue:
    name: File a drift issue
    runs-on: ubuntu-latest
    needs: enum-diff
    if: failure() && needs.enum-diff.outputs.drift == 'true'
    permissions:
      issues: write
    steps:
      - name: File a drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          DIFF: ${{ needs.enum-diff.outputs.diff }}
          NIGHTLY: ${{ needs.enum-diff.outputs.nightly }}
        run: |
          gh label create enum-drift -R "$GITHUB_REPOSITORY" --force --description "vuls-data-update enum vocabulary drift" --color D93F0B
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --label enum-drift --state open --json number --jq '.[].number')" ]; then
            # The body template is one quoted heredoc: the markdown is full of
            # backticks, which an unquoted heredoc would run as command
            # substitutions. envsubst fills in the dynamic values, restricted
            # to the explicit list so nothing else that looks like $VAR is
            # touched.
            # shellcheck disable=SC2016 # the literal $NAMEs are envsubst's variable list
            envsubst '$NIGHTLY $DIFF $GITHUB_SERVER_URL $GITHUB_REPOSITORY $GITHUB_RUN_ID' > /tmp/enum-issue.md <<'BODY_EOF'
          The scheduled check-enums run failed: the vuls-data-update pinned in go.mod knows fewer enum values than the nightly branch (compared against commit $NIGHTLY). A dependency bump is due before data produced with the new values reaches detection.

          ```diff
          $DIFF
          ```

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          ## Remediation

          Bump along the dependency chain, upstream first. Bumping vuls-data-update here alone is not enough: the standalone vuls2 binary (and the nightly DB build in vulsio/vuls-data-db) resolves vuls-data-update via vuls2's own go.mod, so it would keep skipping data carrying the new values.

          1. In MaineK00n/vuls2: `go get github.com/MaineK00n/vuls-data-update@$NIGHTLY && go mod tidy`, test, PR, merge.
          2. Here: `go get github.com/MaineK00n/vuls2@<commit the step-1 merge produced on vuls2 nightly> && go mod tidy` — vuls2 PRs land on its nightly branch; pin the merge commit hash rather than `@nightly`, which resolves through the module proxy and can lag behind the branch tip. Module graph resolution raises the direct vuls-data-update requirement to the same version. Open a PR with `Fixes #<this issue>`.
          3. Verify parity before pushing: `GOEXPERIMENT=jsonv2 go run github.com/MaineK00n/vuls-data-update/tools/print-enums` for the pinned version vs `...@$NIGHTLY` — the diff must be empty (or re-run this workflow via workflow_dispatch on the PR branch).

          In each bump PR, list the incoming merged PRs (`gh api 'repos/MaineK00n/<repo>/compare/<old>...<new>' --jq '.commits[].commit.message | split("\n")[0]'`) so reviewers can see what the bump pulls in.
          BODY_EOF
            gh issue create -R "$GITHUB_REPOSITORY" --title "vuls-data-update enum vocabulary drift" --label enum-drift --assignee MaineK00n,shino --body-file /tmp/enum-issue.md
          fi
